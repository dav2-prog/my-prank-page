<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 👁️ 完美欺騙 Discord 畫出官方禮物卡片的 Meta 標籤 -->
    <title>有人送出了一個禮物！</title>
    <meta property="og:title" content="有人送出了一個禮物！">
    <meta property="og:description" content="寄件人：tamamo704&#10;27 小時後過期">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://website-files.com">
    <meta name="theme-color" content="#242528">

    <style>
        body {
            background-color: #36393f;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .nitro-card {
            background-color: rgba(47, 49, 54, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 51, 51, 0.3);
            border-radius: 12px;
            padding: 25px;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        h2 { margin-top: 0; font-size: 22px; }
        p { color: #b9bbbe; font-size: 14px; line-height: 1.5; }
        button {
            background-color: #5865F2; color: white; border: none;
            padding: 12px 24px; font-size: 16px; border-radius: 4px;
            cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px;
        }
        button:hover { background-color: #4752C4; }

        #boss-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('boss.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 惡作劇觸發後會瞬間填滿全螢幕的背景 -->
    <div id="boss-bg"></div>

    <!-- 這裡保證回歸初始未被整的 Discord 兌換卡片畫面 -->
    <div class="nitro-card" id="main-card">
        <h2>🎁 收到 Nitro 禮物！</h2>
        <p>來自 <b>Discord 官方系統</b> 的 3 個月 Nitro 高級版免費贈送。</p>
        <button onclick="startPrank()">立即兌換禮物</button>
    </div>

    <!-- 原生播放器元件，預設隱藏 -->
    <audio id="my-audio" src="boss.mp3"></audio>

    <script>
        function startPrank() {
            const audio = document.getElementById('my-audio');
            const bgElement = document.getElementById('boss-bg');
            
            // 1. 顯示全螢幕 Boss 戰畫面（加入隨機參數強迫重載圖片）
            bgElement.style.backgroundImage = "url('boss.jpg?v=" + new Date().getTime() + "')";
            bgElement.style.display = "block";
            
            // 2. 音樂跳到第 6 秒並爆發播放
            audio.currentTime = 6;
            audio.play().catch(function(error) {
                console.log("自動播放被瀏覽器攔截:", error);
            });
            
            // 3. 將中間的卡片內容切換成黑魂魔王戰警告文字，徹底移除重新兌換按鈕
            document.getElementById('main-card').style.borderColor = '#ff3333';
            document.getElementById('main-card').innerHTML = `
                <h1 style="color: #ff3333; font-size: 28px; margin: 0; letter-spacing: 2px;">⚠️ BOSS BATTLE ⚠️</h1>
                <h2 style="color: #fff; margin-top: 15px;">食屍鬼・梅莉菲利亞</h2>
                <p style="color: #ffaaaa; font-weight: bold;">天下沒有免費的 Nitro！你已觸發隱藏頭目戰！</p>
            `;
        }
    </script>

</body>
</html>
