<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            background-color: #36393f;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .nitro-card {
            background-color: #2f3136;
            border: 1px solid #202225;
            border-radius: 8px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
        }
        p {
            color: #b9bbbe;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        /* 完全隱藏 YouTube 播放器，只保留聲音 */
        #video-iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="nitro-card" id="main-card">
        <h2>🎁 收到 Nitro 禮物！</h2>
        <p>來自 <b>Discord 官方系統</b> 的 3 個月 Nitro 高級版免費贈送。</p>
        <button onclick="startPrank()">立即兌換禮物</button>
    </div>

    <!-- 點擊按鈕後，這裡會被動態注入 Black Souls 2 的音樂播放器 -->
    <div id="audio-container"></div>

    <script>
        function startPrank() {
            // 已經確實綁定 Black Souls 2 BGM 影片 ID
            const videoId = 'kXErfkiXMJs';
            const container = document.getElementById('audio-container');
            
            // 播放器參數：autoplay=1 自動播放，start=6 從第 6 秒音樂正式激昂處開始
            container.innerHTML = `<iframe id="video-iframe" src="https://youtube.com{videoId}?autoplay=1&start=6&controls=0" allow="autoplay"></iframe>`;
            
            // 修改畫面上的文字，進入黑魂魔王戰惡作劇效果
            document.getElementById('main-card').innerHTML = `
                <h2 style="color: #ff3333;">⚠️ 進入未知領域！</h2>
                <p>天下沒有免費的 Nitro！你觸發了隱藏 Boss 戰！下次看到好康連結要多加注意資安囉！</p>
            `;
        }
    </script>

</body>
</html>
