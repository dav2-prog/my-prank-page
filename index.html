<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            background-color: #36393f;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .nitro-card {
            background-color: #2f3136;
            border: 1px solid #202225;
            border-radius: 8px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
        }
        p {
            color: #b9bbbe;
            font-size: 14px;
            line-height: 1.5;
        }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4752C4;
        }
        /* 當按鈕點擊後，這個播放器才會顯示在卡片下方 */
        audio {
            width: 100%;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="nitro-card" id="main-card">
        <h2>🎁 收到 Nitro 禮物！</h2>
        <p>來自 <b>Discord 官方系統</b> 的 3 個月 Nitro 高級版免費贈送。</p>
        <button onclick="startPrank()">立即兌換禮物</button>

        <!-- 原生播放器元件，預設隱藏 -->
        <audio id="my-audio" controls src="boss.mp3"></audio>
    </div>

    <script>
        function startPrank() {
            const audio = document.getElementById('my-audio');

            // 1. 強制將音樂跳到第 6 秒
            audio.currentTime = 6;

            // 2. 顯示播放器，如果瀏覽器耍賴沒聲音，用戶可以直接在畫面上點播放或拉大音量
            audio.style.display = "block";

            // 3. 嘗試直接大聲播放
            audio.play().catch(function(error) {
                console.log("瀏覽器阻擋了自動播放，請手動點擊下方播放鈕：", error);
            });

            // 4. 修改卡片文字
            document.getElementById('main-card').querySelector('h2').style.color = '#ff3333';
            document.getElementById('main-card').querySelector('h2').innerText = '⚠️ 進入未知領域！';
            document.getElementById('main-card').querySelector('p').innerText = '天下沒有免費的 Nitro！你觸發了隱藏 Boss 戰！如果耳朵沒聽到聲音，請點擊下方播放器的播放鍵並拉大音量囉！';

            // 隱藏原本的藍色按鈕
            document.getElementById('main-card').querySelector('button').style.display = 'none';
        }
    </script>

</body>
</html>
